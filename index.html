<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-page title, meta description, canonical, and OG/Twitter tags are
         injected by the Seo component (react-helmet-async) at build time for
         every route — including a correct self-referential canonical on each
         page. Nothing static here, to avoid duplicate title/canonical elements.
         (This supersedes the earlier runtime SeoHead + baseline canonical.) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet" />
    <!-- Google Analytics 4 — only fires on the deployed site, not localhost -->
    <script>
      (function () {
        var id = '%VITE_GA_MEASUREMENT_ID%';
        var host = location.hostname;
        if (!id || host === 'localhost' || host === '127.0.0.1' || host === '') return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', id);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
